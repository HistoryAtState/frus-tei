# Builds the xar, installs it into eXist-db and runs a smoke test. On branches,
# keeps .last-modified/ current; on main, releases with semantic-release.

name: exist-db CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils
      # find -exec … + batches the ~390,000 files; $(find …) would exceed the
      # argument limit
      - name: Ensure all XML files are well-formed
        run: find . -path ./node_modules -prune -o -type f -name '*.xml' -exec xmllint --noout {} +
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the xar
        run: ant -Dapp.version=1.0.0-SNAPSHOT

      # The index configuration declares a vector field, so the package needs
      # an eXist-db with the vector extension
      - name: Start eXist-db
        run: |
          docker run -dit -p 8080:8080 -v ${{ github.workspace }}/build:/exist/autodeploy \
          --name exist --rm --health-interval=2s --health-start-period=4s \
          duncdrum/existdb:experimental
      - name: Wait for the package to deploy
        timeout-minutes: 30
        run: |
          until docker logs exist 2>&1 | grep -q "Server has started"; do sleep 2s; done
      - name: Run smoke test
        run: bats --tap test/*.bats

  lastmod:
    uses: HistoryAtState/ci-actions/.github/workflows/last-mod.yml@v1
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    needs: [lint, build]
    with:
      include: 'data/*.xml'
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --no-optional
      - name: Perform release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release
